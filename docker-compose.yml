# ============================================================
# KHunter - A股量化选股系统  Docker Compose 编排
# 启动:  docker compose up -d --build
# 日志:  docker compose logs -f
# 停止:  docker compose down
# ============================================================
services:
  khunter:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # 国内网络可改成: https://pypi.tuna.tsinghua.edu.cn/simple
        PIP_INDEX_URL: https://pypi.org/simple
    image: khunter:latest
    container_name: khunter
    restart: unless-stopped
    ports:
      - "5001:5001"
    environment:
      TZ: Asia/Shanghai
      MPLBACKEND: Agg
      PYTHONUNBUFFERED: "1"
    volumes:
      # 配置（含钉钉/数据源密钥、策略参数）：可写，策略参数改动需持久化
      - ./config:/app/config
      # 数据库与行情缓存
      - ./data:/app/data
      # 运行日志
      - ./logs:/app/logs
      # 生成的报告
      - ./reports:/app/reports
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; socket.create_connection(('127.0.0.1', 5001), 5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s
